[package]
name = "react-server-dom-esm"
version.workspace = true
edition.workspace = true
publish.workspace = true

# React Server Components bindings for DOM using native ES modules,
# `react-server-dom-esm`. Its modules are its files, each beside the JS
# rust-js writes from it; its root, `client` and `server` declare them and
# write no JS of their own.

[dependencies]
acorn-loose.workspace = true
busboy.workspace = true
js.workspace = true
node.workspace = true
react-client = { path = "../react-client" }
react-server = { path = "../react-server" }
shared.workspace = true
webapi.workspace = true
webpack-sources.workspace = true

[lints]
workspace = true

[package]
name = "react-test-renderer"
version.workspace = true
edition.workspace = true
publish.workspace = true

# React's renderer for snapshot testing, `react-test-renderer`. Its modules
# are its files, each beside the JS rust-js writes from it; its root declares
# them and writes no JS of its own.
[lib]
path = "test_renderer.rs"

[dependencies]
js.workspace = true
react-isomorphic = { path = "../react" }
react-reconciler = { path = "../react-reconciler" }
shared.workspace = true
webapi.workspace = true

[lints]
workspace = true

[package]
name = "react-server-dom-turbopack"
version.workspace = true
edition.workspace = true
publish.workspace = true

# React Server Components bindings for DOM using Turbopack,
# `react-server-dom-turbopack`. Its modules are its files, each beside the JS
# rust-js writes from it; its root, `client`, `server` and `shared` declare
# them and write no JS of their own.

[dependencies]
busboy.workspace = true
js.workspace = true
node.workspace = true
react-client = { path = "../react-client" }
react-server = { path = "../react-server" }
shared.workspace = true
webapi.workspace = true

[lints]
workspace = true

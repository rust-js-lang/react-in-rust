[package]
name = "rust-js-bindings-webpack"
# webpack's major and minor, and the binding's own patch (ADR 0116).
version = "5.82.0"
edition = "2024"
license = "MIT"
description = "rust-js bindings of webpack, what a plugin of webpack's compiler uses"
publish = false

[lib]
name = "webpack"
path = "src/lib.rs"

[dependencies]
js = { package = "rust-js-builtins", version = "~0.0.2" }
tapable = { package = "rust-js-bindings-tapable", version = "~2.2.0" }

# What it binds is webpack's own JS: rustc checks it, and rust-js reads its
# metadata (ADRs 0024, 0414).
[package.metadata.rust-js]
bindings = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_js)"] }

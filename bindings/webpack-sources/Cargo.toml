[package]
name = "rust-js-bindings-webpack-sources"
# webpack-sources' major and minor, and the binding's own patch (ADR 0116).
version = "3.2.0"
edition = "2024"
license = "MIT"
description = "rust-js bindings of webpack-sources' source map helpers"
publish = false

[lib]
name = "webpack_sources"
path = "src/lib.rs"

[dependencies]
js = { package = "rust-js-builtins", version = "~0.0.2" }

# What it binds is webpack-sources' own JS: rustc checks it, and rust-js
# reads its metadata (ADRs 0024, 0414).
[package.metadata.rust-js]
bindings = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_js)"] }

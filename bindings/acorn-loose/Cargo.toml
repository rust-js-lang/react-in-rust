[package]
name = "rust-js-bindings-acorn-loose"
# acorn-loose's major and minor, and the binding's own patch (ADR 0116).
version = "8.3.0"
edition = "2024"
license = "MIT"
description = "rust-js bindings of acorn-loose, a JavaScript parser that never fails"
publish = false

[lib]
name = "acorn_loose"
path = "src/lib.rs"

[dependencies]
js = { package = "rust-js-builtins", version = "~0.0.2" }

# What it binds is acorn-loose's own JS: rustc checks it, and rust-js reads its
# metadata (ADRs 0024, 0414).
[package.metadata.rust-js]
bindings = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_js)"] }

# React's packages, each a crate whose modules are its files: a module's
# Rust beside the JS rust-js writes from it, `src/SchedulerMinHeap.rs` to
# `src/SchedulerMinHeap.js`, which React's build and tests read as they
# read the rest. rust-js is a checkout beside this one, built from source.
[workspace]
resolver = "3"
members = ["bindings/art", "bindings/bun", "bindings/busboy", "packages/react", "packages/react-art", "packages/react-client", "packages/react-dom", "packages/react-dom-bindings", "packages/react-dom-bindings/src/server/fizz-instruction-set", "packages/react-is", "packages/react-markup", "packages/react-noop-renderer", "packages/react-reconciler", "packages/react-server", "packages/react-server-dom-esm", "packages/react-server-dom-fb", "packages/react-server-dom-parcel", "packages/react-server-dom-turbopack", "packages/react-server-dom-unbundled", "packages/react-server-dom-webpack", "packages/react-test-renderer", "packages/scheduler", "packages/shared"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
js = { package = "rust-js-builtins", path = "../rust-js/builtins" }
webapi = { package = "rust-js-webapi", path = "../rust-js/webapi" }
node = { package = "rust-js-node", path = "../rust-js/node" }
shared = { path = "packages/shared" }
art = { package = "rust-js-bindings-art", path = "bindings/art" }
bun = { package = "rust-js-bindings-bun", path = "bindings/bun" }
busboy = { package = "rust-js-bindings-busboy", path = "bindings/busboy" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_js)"] }

# A binding of the community's, as `bindings/art` is, names rust-js's crates
# by version, as rust-js-lang/bindings' do: these are where they are (ADR
# 0118's patch, written by hand while rust-js is a checkout beside this one).
[patch.crates-io]
rust-js-builtins = { path = "../rust-js/builtins" }
rust-js-node = { path = "../rust-js/node" }
rust-js-webapi = { path = "../rust-js/webapi" }
